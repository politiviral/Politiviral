<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Politiviral Admin</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: #fff;
    }

    header {
      padding: 24px;
      border-bottom: 1px solid #26303a;
    }

    header h1 {
      margin: 0 0 6px;
    }

    header p {
      margin: 0;
      color: #aab4bf;
    }

    main {
      padding: 24px;
      max-width: 1000px;
      margin: auto;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .card {
      background: #111820;
      border: 1px solid #26303a;
      border-radius: 14px;
      padding: 22px;
    }

    .card h2 {
      margin-top: 0;
    }

    .card p {
      color: #aab4bf;
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #ff735c;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <header>
    <h1>Politiviral Admin</h1>
    <p>Management Dashboard</p>
  </header>

  <main>
    <div class="grid">

      <div class="card">
        <h2>📰 Stories</h2>
        <p>Manage political and community stories.</p>
        <a href="stories-admin.html" style="display:block;text-align:center;text-decoration:none;padding:13px;border-radius:8px;background:#ff735c;color:white;font-size:16px;">
Add / Manage Stories
</a>
      </div>

      <div class="card">
        <h2>📢 Campaigns</h2>
        <p>Manage campaign information and listings.</p>
        <button>Manage Campaigns</button>
      </div>

      <div class="card">
        <h2>📣 Advertising</h2>
        <p>Review advertising requests and sponsored listings.</p>
        <button>Manage Advertising</button>
      </div>

      <div class="card">
        <h2>⚙️ Settings</h2>
        <p>Manage website settings and administration.</p>
        <button>Settings</button>
      </div>

    </div>
  </main>

</body>
</html>
